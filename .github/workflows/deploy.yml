name: Bundle and Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/make-icon.js
      - run: mkdir -p bundles && npm run bundle -- --folder=0.8
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: bundles
          clean: true
